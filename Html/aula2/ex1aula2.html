<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, th, td{
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Nome</th>
            <th colspan="2">Telefone</th>
        </tr>
        <tr>
            <td>Eduardo</td>
            <td>10</td>
            <td>70</td>
        </tr>
        <tr>
           <td>João</td>
           <td>20</td>
           <td>50</td>
        </tr>
    </table>
    <table>
        <thead>
        <tr>
            <th>Mês</th>
            <th>Salário</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>Janeiro</td>
            <td>R$1000,00</td>
        </tr>
        <tr>
            <td>Fevereiro</td>
            <td>R$2000,00</td>
        </tr>
        </tbody>
        <tfoot>
            <td>Soma</td>
            <td>R$3000,00</td>
        
        </tfoot>



    </table>
</body>
</html>
