<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid{
            display: grid;
            grid-template-areas:"header"
                                "main"
                                "footer";
    
        }
        .header{
            background-color: rgb(37, 43, 82);
        }
        .container{
            display: grid;
            align-items: center;
            grid-template-columns:10px 40px 40px 40px 40px 10px;
            grid-gap: 100px;
            font-size: 28px;
        }
        .container > a{
            padding: 30px;
            width: 70px;
            height: 25px;
            margin-left: 470px;
            transition:background-color 2s ease, color 2s ease;
            color: whitesmoke;
            text-decoration: none;
        }
        .container > a:hover{
            background-color:rgba(145, 117, 117, 0.3);
            color: rgb(37, 52, 212);
        }
        .container > .login{
            margin-left: 650px;
        }
        .container > .sign{
            margin-left: 680px;
        }
        .main{
            display: flex;
            flex-wrap: wrap;
        }
        .principal{
            display: flex;
            flex-wrap: wrap;
            background-color: rgb(4, 101, 186);
            width: 1000px;
            height: 79vh;
            gap: 20px;
            font-size: 40px;
           
        }
        .principal > div{
           color: rgb(202, 202, 15);
           padding: 50px;
           background-color: black;
           margin-top: 30px;
           height: 100px;
           width: 170px;
           margin-left: 38px;
           
        } 
        .menuesquerdo{
            background-color: rgb(37, 43, 82);
            width: 270px;
            font-size: 55px;
        }
        .menuesquerdo > a{
            display: flex;
            flex-wrap: wrap;
            text-align: center;
            margin-top: 40px;
            text-decoration: none;
            color: rgb(104, 111, 176);
            max-height: 130px;
            height: 200px;
            transition:background-color 2s ease, color 2s ease;
        }
        .menuesquerdo >a:hover{
            background-color:rgba(145, 117, 117, 0.3);
            color: rgb(220, 220, 220);
        }
        .slidebar{
            background-color: rgb(0, 23, 173) ;
            width: 234px;
            display: flex;
            flex-wrap: wrap;
            flex-direction: column;
            gap: 20px;
            font-size: 30px;
        }
        .slidebar > div{
            color: rgb(142, 99, 181);
            padding: 50px;
            background-color: black;
            width: 80px;
            margin-left: 27px;
            margin-top: 30px;

        }
        .footer{
            background-color: rgb(19, 19, 58);
            color: rgb(221, 192, 2);
            height: 60px;
            text-align: center;
        }
        
    </style>
</head>
<body>
    <div class="grid">
        <div class="header">
            
            <div class="container">
                <img src="logo_trytech.png" style="width: 400px; height: 100px;">
                <a href="">Menu</a>
                <a href="">Sobre</a>
                <a href="">Contato</a>
                <img src="account.png" style="width: 100px;" height="100px" class="sign">
                <a href="" class="login">Login</a>
            </div>
        </div>
        <div class="main">
            <div class="menuesquerdo">
                <a href="">Tecnologias</a>
                <a href="">Postagens</a>
                <a href="">Novas Notícias</a>
            </div>
            <div class="principal">
                <div>Card1</div>
                <div>Card2</div>
                <div>Card3</div>
                <div>Card4</div>
                <div>Card5</div>
                <div>Card6</div>
            </div>
            <div class="slidebar">
                <div>Card1</div>
                <div>Card2</div>
                <div>Card3</div>
            </div>
        </div>
        <div class="footer">Informações</div>
    </div>
</body>
</html>
