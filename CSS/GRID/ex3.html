<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid{
            display: grid;
            grid-template-areas:"header"
                                "main";
                                
    
        }
        .header{
            background-color: rgb(201, 6, 6);
            height: 140px;
        }
        .container{
            display: grid;
            align-items: center;
            grid-template-columns:10px 40px 10px 40px ;
            grid-gap: 100px;
            font-size: 28px;
        }
        .container > input{
         margin-left: 300px;
         width: 700px;   
         height: 30px;
        }
        .container > a:hover{
            background-color:rgba(145, 117, 117, 0.3);
            color: rgb(37, 52, 212);
        }
        .container > .login{
            margin-left: 1000px;
            text-decoration: none;
            color: white;
        }
        .container > .sign{
            margin-left: 980px;
        }
        .main{
            display: flex;
            flex-wrap: wrap;
        }
        .principal{
            display: flex;
            flex-wrap: wrap;
            background-color: rgb(212, 212, 212);
            width: 82vw;
            height:max-content ;
            gap: 5px;
            font-size: 40px;
           
        }
        .principal > div{
           color: rgb(0, 0, 0);
           padding: 50px;
           background-color: rgb(155, 20, 20);
           margin-top: 30px;
           height: 100px;
           width: 170px;
           margin-left: 38px;
           
        } 
        .menuesquerdo{
            background-color: rgb(201, 6, 6);
            width: 240px;
            font-size: 55px;
        }
        .menuesquerdo > a{
            display: flex;
            flex-wrap: wrap;
            text-align: center;
            margin-top: 40px;
            text-decoration: none;
            color: rgb(0, 0, 0);
            max-height: 130px;
            height: 200px;
            transition:background-color 2s ease, color 2s ease;
        }
        .menuesquerdo >a:hover{
            background-color:rgba(145, 117, 117, 0.3);
            color: rgb(220, 220, 220);
        }
    </style>
</head>
<body>
    <div class="grid">
        <div class="header">
            
            <div class="container">
                <img src="logo_trytech.png" style="width: 400px; height: 100px;">
                <input type="text" id="search"name="search" placeholder="Pesquise vídeos aqui!">
                <img src="account.png" style="width: 100px;" height="100px" class="sign">
                <a href="" class="login">Login</a>
            </div>
        </div>
        <div class="main">
            <div class="menuesquerdo">
                <a href="">Início</a>
                <a href="">Shorts</a>
                <a href="">Histórico</a>
            </div>
            <div class="principal">
                <div>Vídeo1</div>
                <div>Vídeo2</div>
                <div>Vídeo3</div>
                <div>Vídeo4</div>
                <div>Vídeo5</div>
                <div>Vídeo6</div>
                <div>Vídeo7</div>
                <div>Vídeo8</div>
                <div>Vídeo9</div>
                <div>Vídeo10</div>
                <div>Vídeo11</div>
                <div>Vídeo12</div>
            </div>
    </div>
</body>
</html>
