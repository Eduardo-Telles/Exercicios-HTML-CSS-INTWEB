<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: flex;
  background-color: dodgerblue;
}

.container div {
  background-color: #f1f1f1;
  color:#000;
  width: 100px;
  margin: 10px;
  padding: 10px;
  text-align: center;
  font-size: 30px;
}
</style>
</head>
<body>

    <h1>Propriedade <i>flex-shrink</i></h1>
    
    <p>Deixe o terceiro item flexível encolher duas vezes mais que os outros itens flexíveis:</p>
    
    <div class="container">
      <div>1</div>
      <div>2</div>
      <div style="flex-shrink: 2">3</div>
      <div>4</div>
      <div>5</div>
    </div>
    
</body>
</html>
