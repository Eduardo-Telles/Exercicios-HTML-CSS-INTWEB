<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: flex;
  height: 200px;  
  background-color: dodgerblue;
}

.container div {
  background-color: #f1f1f1;
  color:#000;
  width: 100px;
  margin: 10px;
  padding: 10px;
  text-align: center;
  font-size: 30px;
}
</style>
</head>
<body>

    <h1>align-self: center</h1>
    
    <p>O "align-self: center"; alinha o item flexível no meio do contêiner:</p>
    
    <div class="container">
      <div>1</div>
      <div>2</div>
      <div style="align-self: center">3</div>
      <div>4</div>
    </div>
    
    <p>A propriedade align-self substitui a propriedade align-items do contêiner.</p>
    
</body>
</html>
