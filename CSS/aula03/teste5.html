<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: flex;
  background-color: dodgerblue;
}

.container div {
  background-color: #f1f1f1;
  color:#000;
  width: 100px;
  margin: 10px;
  padding: 10px;
  text-align: center;
  font-size: 30px;
}
</style>
</head>
<body>

    <h1>Propriedade <i>flex-grow</i></h1>
    
    <p>Faça o terceiro item flexível crescer quatro vezes mais rápido que os outros itens flexíveis:</p>
    
    <div class="container">
      <div style="flex-grow: 1">1</div>
      <div style="flex-grow: 1">2</div>
      <div style="flex-grow: 4">3</div>
    </div>
    
</body>
</html>
